# Nginx do frontend — serve o build estático do Vite e faz proxy reverso
# de /api/* para o backend, DENTRO da rede interna do Docker Compose.
#
# O navegador do usuário NUNCA recebe "backend:3001" em nenhuma resposta
# — ele só conhece esta origem (a porta publicada deste serviço, ex.
# 8080:80). O hostname "backend" só é resolvido pelo Nginx, via o DNS
# interno da rede do Compose (nome do serviço).
#
# Arquitetura de comunicação:
#   Browser --(/api/*)--> Nginx (este arquivo) --(http://backend:3001/*)--> Backend --> Prisma --> PostgreSQL

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de API: tudo que chega em /api/<resto> é repassado para
    # http://backend:3001/<resto> (a barra final em `proxy_pass`, igual
    # à barra final em `location /api/`, é o que faz o Nginx REESCREVER
    # o caminho removendo o prefixo "/api" — sem essa barra em um dos
    # dois lados, o prefixo "/api" seria indevidamente repassado ao
    # backend, que não tem nenhuma rota sob "/api").
    location /api/ {
        proxy_pass http://backend:3001/;

        # Preserva método HTTP e corpo da requisição (GET/POST/DELETE
        # com body JSON) sem modificação — comportamento padrão do
        # proxy_pass, explicitado aqui para não ser quebrado por uma
        # futura diretiva `proxy_method`/`proxy_set_body` acidental.
        proxy_http_version 1.1;

        # Headers originais preservados para o backend (Host real do
        # cliente, IP original, protocolo original) — o CORS do backend
        # já é permissivo (`cors()` sem restrição), mas preservar esses
        # headers é a prática correta de qualquer proxy reverso,
        # independente disso.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Content-Type/Content-Length do body (JSON) são preservados
        # automaticamente pelo proxy_pass — nenhuma diretiva adicional é
        # necessária para isso.
    }

    # SPA fallback: qualquer rota que não seja um arquivo estático real
    # (ex. uma rota de cliente como "/periodos") cai em index.html, para
    # o React assumir o roteamento no navegador — sem isso, recarregar a
    # página numa rota diferente da raiz devolveria 404 do Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
